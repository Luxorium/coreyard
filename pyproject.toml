# Packaging metadata. The supported install is ./install.sh, which builds the venv and the
# bin/coreyard launcher; this file exists so `pip install -e .` also works and so the
# `coreyard` console script is defined in exactly one place alongside `python -m coreyard`.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coreyard"
dynamic = ["version"]
description = "Publish a salvage yard's inventory to Shopify, and keep it in step."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["impacket>=0.13", "requests>=2.31"]

[project.scripts]
coreyard = "coreyard.cli:main"

# Read from coreyard/__init__.py so the package metadata, `coreyard --version` and the
# release tag all come from one declaration.
[tool.setuptools.dynamic]
version = { attr = "coreyard.__version__" }

[tool.setuptools.packages.find]
include = ["coreyard*"]

# The demo yard and the two config templates ship inside the package, not beside it.
# `coreyard init --demo` is the advertised way to try CoreYard and "copy the example and fill
# it in" is the first step of a real setup; an installed wheel that cannot find either can
# only offer both to someone who also happens to have the checkout.
[tool.setuptools.package-data]
coreyard = ["examples/*"]
