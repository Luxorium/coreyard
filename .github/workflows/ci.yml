name: CI

on:
  # Every branch, not just the default one. A contributor who pushes a branch should
  # learn it is broken from CI, not from a reviewer — and a branch that only runs its
  # tests once a pull request exists gets no signal during the work that matters.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push supersedes the run it interrupted, so a branch pushed three times in a
# minute does not hold four sets of runners to answer the same question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite
        run: python -m unittest discover -t . -s tests -v

  neutrality:
    name: vendor neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No vendor names or site schema in the repository
        run: python scripts/check_neutrality.py

  inventory:
    name: functionality inventory is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # REL-01/REL-05. The inventory is generated from the live command tree, so this
      # fails when a command is added, renamed or removed without the document following.
      - name: docs/INVENTORY.md matches the command tree
        run: python scripts/inventory.py --check
      # QA-02. A criterion with no ledger row is one nobody looks at again.
      - name: Every acceptance criterion has an evidence-ledger row
        run: python scripts/ledger.py --summary
      # DIST-02. The direct dependencies are declared twice — for the wheel and for the
      # installer — and the copy nobody installs from is the one that goes stale.
      - name: The two dependency declarations agree
        run: python scripts/dependencies.py --check
      # UX-02. A settings reference that describes keys the code no longer reads is worse
      # than none, because it is believed.
      - name: docs/SETTINGS.md matches the code that reads each setting
        run: python scripts/settings.py --check

  hygiene:
    name: whitespace and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `git diff --check` only sees a working tree, so on a clean checkout it passes
      # regardless. Scan the tracked files themselves.
      - name: No trailing whitespace in tracked text files
        run: |
          if git grep -nI -E ' +$' -- . ; then
            echo "::error::trailing whitespace above"; exit 1
          fi
      # REL-03/DIST-01: the built artifact must carry the same version the CLI reports.
      - name: The built package version equals coreyard.__version__
        run: |
          pip install --upgrade pip build
          python -m build --wheel --outdir dist/ .
          runtime=$(python -c "import coreyard; print(coreyard.__version__)")
          echo "runtime version: $runtime"
          ls dist/ | grep -F "coreyard-$runtime-" || {
            echo "::error::built wheel does not carry version $runtime"; ls dist/; exit 1;
          }

  installer:
    name: installer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh
        run: ./install.sh --no-deps --yes
      # DIST-03. The installer finishing is not the same as the installation working, and
      # the two commands the README prints next are the ones a new customer runs first.
      # Both were broken on a clean machine while this job was green: install.sh seeded a
      # .env that made `init` refuse, and `sync` then asked a CSV source for a database.
      - name: The documented quickstart, on the installation it just made
        run: |
          set -euo pipefail
          bin/coreyard init --demo
          bin/coreyard sync --sink csv --dry-run
          home="${XDG_DATA_HOME:-$HOME/.local/share}/coreyard"
          test -s "$home/out/products.csv"

  packaged:
    name: the built wheel runs the quickstart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # QA-01/DIST-03/DIST-04: "a passing source checkout alone is insufficient". This job
      # exists because every earlier check ran inside a tree that already had a schema.json,
      # a .env and a photo share sitting beside the code — so four database requirements on
      # the documented CSV path went unnoticed for as long as they did.
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/ .
      - name: Install it into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
      - name: The wheel carries its own example yard and config templates
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PROBE'
          from coreyard.config import bundled
          for name in ("parts.csv", "schema.example.json", "store.example.json"):
              path = bundled(name)
              assert path.is_file(), f"{name} is not in the wheel: {path}"
          print("bundled files present")
          PROBE
      - name: Run the quickstart from a directory with no checkout in it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          export COREYARD_HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/venv/bin/coreyard" --version
          "$RUNNER_TEMP/venv/bin/coreyard" init --demo
          "$RUNNER_TEMP/venv/bin/coreyard" sync --sink csv --dry-run
          "$RUNNER_TEMP/venv/bin/python" - <<'COUNT'
          import csv, os, pathlib
          path = pathlib.Path(os.environ["COREYARD_HOME"], "out", "products.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8")))
          assert len(rows) == 7, f"expected the seven-part example yard, got {len(rows)}"
          print("rendered", len(rows), "products")
          COUNT
